[package]
name = "mira-commander"
version = "0.1.0"
edition = "2021"
authors = ["Kemal Akçocuk"]
description = "Modern dual-pane orthodox file manager inspired by Norton Commander"
license = "MIT"

[lib]
name = "mira_commander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "MiraCommander"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
image = "0.25.10"
base64 = "0.23.1"
walkdir = "2.5.0"
zip = "9.1.3"
fs4 = "1.1.0"
globset = "0.4.21"
encoding_rs = "0.8.42"
opener = "0.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
